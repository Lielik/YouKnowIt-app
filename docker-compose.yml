# Local development stack — runs the app and PostgreSQL together

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persists data between restarts
    ports:
      - "5432:5432" # expose DB port for local inspection with tools like DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI application
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env # loads all variables from your .env file
    depends_on:
      db:
        condition: service_healthy # waits for DB to be ready before starting
    volumes:
      - ./app:/app/app # mounts local code into container — changes reflect instantly
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # --reload auto-restarts on code changes

volumes:
  postgres_data: # named volume — survives container restarts
