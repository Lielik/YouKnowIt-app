# CI/CD Pipeline
# test-unit → build-image → test-integration → release → notify
# test-unit, build-image, test-integration: all branches and PRs
# release: main and feature/* only
# notify: always

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/*"
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job: Unit Tests ───────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: pytest tests/unit/ -v

  # ── Job: Build Docker Image ───────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Build Docker image
        run: docker build -t youknowit-app:test .

      - name: Save Docker image to cache
        run: docker save youknowit-app:test | gzip > youknowit-app.tar.gz

      - name: Cache Docker image
        uses: actions/cache@v5.0.5
        with:
          path: youknowit-app.tar.gz
          # cache key is based on the commit SHA — unique per commit
          key: docker-image-${{ github.sha }}

  # ── Job: Integration Tests ────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-image

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
        run: pytest tests/integration/ -v

  # ── Job: Release ──────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test-integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
    outputs:
      version: ${{ steps.version.outputs.tag }}
    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: write # required for pushing git tags

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Restore Docker image from cache
        uses: actions/cache@v5.0.5
        with:
          path: youknowit-app.tar.gz
          key: docker-image-${{ github.sha }}

      - name: Load Docker image
        run: |
          gunzip -c youknowit-app.tar.gz | docker load
          echo "Docker image loaded successfully"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.3

        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Calculate next version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TAGS=$(aws ecr list-images \
              --repository-name $(basename ${{ env.ECR_REPOSITORY }}) \
              --region ${{ env.AWS_REGION }} \
              --query 'imageIds[*].imageTag' \
              --output text 2>/dev/null || echo "")

            LATEST=$(echo "$TAGS" \
              | tr '\t' '\n' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)

            if [ -z "$LATEST" ]; then
              NEXT="v0.0.1"
            else
              MAJOR=$(echo $LATEST | cut -d. -f1 | tr -d 'v')
              MINOR=$(echo $LATEST | cut -d. -f2)
              PATCH=$(echo $LATEST | cut -d. -f3)
              NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            echo "tag=${NEXT}" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT

          elif [[ "${{ github.ref }}" == refs/heads/feature/* ]]; then
            BRANCH=$(echo "${{ github.ref_name }}" \
              | sed 's/feature\///' \
              | sed 's/[^a-zA-Z0-9]/-/g')
            SHA="${GITHUB_SHA::7}"
            TAG="feature-${BRANCH}-${SHA}"

            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Tag version in GitHub repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: |
          IMAGE=${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}
          docker tag youknowit-app:test $IMAGE
          docker push $IMAGE

          if [[ "${{ steps.version.outputs.is_main }}" == "true" ]]; then
            docker tag youknowit-app:test ${{ env.ECR_REPOSITORY }}:latest
            docker push ${{ env.ECR_REPOSITORY }}:latest
          fi

      - name: Cleanup Docker images
        if: always()
        run: |
          docker rmi youknowit-app:test || true
          docker system prune -f || true

  # ── Job: Notify ───────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [test-unit, build-image, test-integration, release]
    if: always()

    steps:
      - name: Determine pipeline status
        id: status
        run: |
          UNIT="${{ needs.test-unit.result }}"
          BUILD="${{ needs.build-image.result }}"
          INTEGRATION="${{ needs.test-integration.result }}"
          RELEASE="${{ needs.release.result }}"

          if [[ "$UNIT" == "failure" || "$BUILD" == "failure" || "$INTEGRATION" == "failure" || "$RELEASE" == "failure" ]]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          elif [[ "$UNIT" == "cancelled" || "$BUILD" == "cancelled" || "$INTEGRATION" == "cancelled" || "$RELEASE" == "cancelled" ]]; then
            echo "result=cancelled" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Slack notification
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.result == 'success' && '✅ Pipeline Succeeded' || steps.status.outputs.result == 'cancelled' && '⚠️ Pipeline Cancelled' || '❌ Pipeline Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*🌿 Branch*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*👤 Triggered by*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*💬 Commit*\n${{ github.event.head_commit.message }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🏷️ Version*\n${{ needs.release.outputs.version || 'N/A' }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*🧪 Unit Tests*\n${{ needs.test-unit.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🐳 Build*\n${{ needs.build-image.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🔬 Integration Tests*\n${{ needs.test-integration.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🚀 Release*\n${{ needs.release.result }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🔗 View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
